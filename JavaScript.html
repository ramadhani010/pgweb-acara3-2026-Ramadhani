<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>

<body>

    Nama: <i id="value_nama"></i>
    <br>
    Umur: <i id="value_umur"></i>
    <script>

        //String Variabel
        var nama = "Ramadhani";

        //Number Variabel
        let umur = 19;

        /*Number Variabel*/
        let tinggi = 160;

        //array
        let film_favorit = ["Spiderman", "Tendangan si madun"]

        //Menampilkan ke jendela Console
        console.log("Nama:" + nama);
        console.log(umur);
        console.log("Tinggi:" + tinggi);
        console.log(film_favorit[1]);

        //Arithmetic Operations
        let a = 13;
        let b = 17.2;

        let jumlah = a + b;
        console.log("Hasil penjumlahan a & b:" + jumlah);

        let kurang = a - b;
        console.log("Hasil pengurangan a & b:" + kurang);

        let kali = a * b;
        console.log("Hasil perkalian a & b:" + kali);

        let bagi = a / b;
        console.log("Hasil pembagian a & b:" + bagi);

        let sisa = a % b;
        console.log("Hasil sisa a & b:" + sisa);

        let pangkat = a ** b;
        console.log("Hasil pangkat a & b:" + pangkat);

        //Conditional statement 
        let nilai = 78;

        if (nilai >= 90) {
            console.log("Nilai A");
        } else if (nilai >= 80) {
            console.log("Nilai B");
        } else if (nilai >= 70) {
            console.log("Nilai C");
        } else if (nilai >= 60) {
            console.log("Nilai D");
        } else {
            console.log("Nilai E");
        }

        //Looping
        for (let i = 1; i <= 99; i++) {
            console.log(i);
        }

        //Function
        function penjumlahan(a, b) {
            console.log(a + b);
        }

        //Memanggil fungsi penjumlahan
        penjumlahan(10, 5);

        //Menampilkan nama ke halaman web (DOM)
        document.getElementById("value_nama").innerHTML = nama;
        document.getElementById("value_umur").innerHTML = umur+ "tahun"


    </script>
</body>

</html>
